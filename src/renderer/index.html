<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Apron</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" class="collapsed">
    <span class="ear left"></span>
    <span class="ear right"></span>
    <span class="priv" id="priv"></span>
    <div class="body">
    <div class="compact">
      <span class="lead" id="compact-lead"></span>
      <span class="compact-text" id="compact-text"></span>
      <span class="trail" id="compact-trail"></span>
    </div>

    <div class="expanded">
      <div class="launcher" id="launcher">
        <input id="launch-input" autocomplete="off" spellcheck="false" placeholder="Open an app or site  ·  ? ask AI  ·  ?? about my screen  ·  n note  ·  t to-do  ·  tr translate">
        <div class="launch-results" id="launch-results"></div>
      </div>
      <nav class="tabs">
        <div class="dock" id="dock">
          <button data-tab="home" data-icon="home" title="Home"></button>
          <button data-tab="media" data-icon="music" title="Music"></button>
          <button data-tab="calendar" data-icon="cal" title="Calendar &amp; homework"></button>
          <button data-tab="claude" data-icon="claude" title="Claude Code &amp; GitHub"><span class="badge" id="claude-badge"></span></button>
          <button data-tab="timer" data-icon="timer" title="Focus, Pomodoro &amp; flashcards"></button>
          <button data-tab="todo" data-icon="check" title="To-do"><span class="badge" id="todo-badge"></span></button>
          <button data-tab="clip" data-icon="clip" title="Clipboard &amp; codes"></button>
          <button data-tab="sys" data-icon="sys" title="System &amp; today"></button>
        </div>
        <span class="tab-name" id="tab-name"></span>
        <button class="pill-btn update-btn" id="update-btn" hidden>Update</button>
        <span class="clock" id="clock"></span>
        <button class="search-btn" id="search-btn" title="Search, open apps, ask Claude (Ctrl+Alt+Space)">⌕</button>
        <button class="swatch-toggle" id="swatch-toggle" title="Accent colour"></button>
        <button class="gear" id="gear" title="Settings">⚙</button>
      </nav>

      <div class="swatches" id="swatches">
        <span class="label">Accent</span>
        <input type="color" id="custom-accent" title="Pick any colour">
        <button class="art-toggle" id="art-toggle" title="Show album art in colour or black &amp; white">Art: B&amp;W</button>
      </div>

      <section class="panel" data-panel="home">
        <div class="home" id="home"></div>
      </section>

      <section class="panel" data-panel="sys">
        <div class="list" id="sys"></div>
      </section>

      <section class="panel" data-panel="media">
        <div class="media" id="media"></div>
      </section>

      <section class="panel" data-panel="calendar">
        <div class="list" id="calendar"></div>
      </section>

      <section class="panel" data-panel="claude">
        <div class="list" id="claude"></div>
      </section>

      <section class="panel" data-panel="timer">
        <div class="timer" id="timer"></div>
      </section>

      <section class="panel" data-panel="todo">
        <form class="todo-add" id="todo-form" autocomplete="off">
          <input id="todo-input" maxlength="200" placeholder="Add a to-do and press Enter">
        </form>
        <div class="list" id="todo"></div>
      </section>

      <section class="panel" data-panel="clip">
        <div class="list" id="clip"></div>
      </section>
    </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
